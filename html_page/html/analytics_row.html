<tr>
    <td class="an-name">
        <span class="an-name__test">%(name)%</span>
        <span class="an-name__suite">%(sname)%</span>
    </td>
    <td data-order="%(tone)%"><span class="verdict verdict--%(tone)%">%(verdict)%</span></td>
    <td class="an-spark">%(spark)%</td>
    <td data-order="%(rate_sort)%">%(rate)%</td>
    <td>%(runs)%</td>
    <td class="metric-num"><span class="metric-pill">%(flips)%</span></td>
    <td class="metric-num metric-rerun"><span class="metric-pill">%(reruns)%</span></td>
    <td data-order="%(streak_sort)%"><span class="streak streak--%(last_tone)%">%(streak)%</span></td>
    <td data-order="%(dur_sort)%">%(dur)%</td>
</tr>
