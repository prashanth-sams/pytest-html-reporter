<div class="step-suite" id="step-suite-%(sindex)%" data-suite-id="%(sindex)%" data-suite="%(sname)%">
    <button type="button" class="step-suite__head" onclick="toggleStepSuite(this)">
        <i class="fa fa-angle-down step-suite__caret" aria-hidden="true"></i>
        <i class="fa fa-file-text-o step-suite__file" aria-hidden="true"></i>
        <span class="step-suite__name" title="%(sname)%">%(short)%</span>
        <span class="step-suite__count">%(count)%</span>
    </button>
    <div class="step-suite__tests">%(tests)%</div>
</div>
