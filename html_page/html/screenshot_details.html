<figure class="shot-card" data-status="%(status_key)%">
    <a class="shot-card__frame" href="pytest_screenshots/%(screen_name)%.png"
       data-fancybox="images" data-caption="SUITE: %(ts)% :: SCENARIO: %(tc)%"
       aria-label="Open the screenshot from %(tc)%">
        <img class="shot-card__shot" src="pytest_screenshots/%(screen_name)%.png"
             alt="Screenshot attached by %(tc)%" loading="lazy" />
        <span class="shot-card__open" aria-hidden="true"><i class="fa fa-expand"></i></span>
        <span class="shot-card__status shot-card__status--%(status_key)%">%(status)%</span>
    </a>
    <figcaption class="shot-card__body">
        <div class="shot-card__test" title="%(tc)%">%(tc)%</div>
        <div class="shot-card__suite" title="%(ts)%"><i class="fa fa-briefcase" aria-hidden="true"></i>%(ts)%</div>
        <p class="shot-card__note">%(te)%</p>
    </figcaption>
</figure>
