<button type="button" class="attach-item" id="attach-item-%(aid)%" data-aid="%(aid)%" data-kind="%(kind)%" data-status="%(status)%" data-row="%(runt)%" data-ms="%(ms)%" data-size="%(size)%" data-search="%(search)%" onclick="showAttachment('%(aid)%')">
    <span class="attach-item__kind attach-item__kind--%(kind)%">%(kind)%</span>
    <span class="attach-item__main">
        <span class="attach-item__title">%(title)%</span>
        <span class="attach-item__test">%(name)%<em>%(sname)%</em></span>
    </span>
    <span class="attach-item__tail">
        <span class="attach-code attach-code--%(status)%">%(code)%</span>
        <span class="attach-item__detail">%(detail)%</span>
    </span>
</button>
