<span class="msg-actions" data-full="%(has_full)%" data-error="%(full_msg)%" data-suite="%(sname)%" data-test="%(name)%">
    <span class="msg-more" aria-hidden="true">&hellip;</span>
    <button type="button" class="msg-btn msg-open" title="Show the full error" aria-label="Show the full error">
        <i class="fa fa-expand" aria-hidden="true"></i>
    </button>
    <button type="button" class="msg-btn msg-copy" title="Copy the full error" aria-label="Copy the full error">
        <i class="fa fa-clipboard" aria-hidden="true"></i>
    </button>
</span>
