<tr>
    <td class="th-left suite-cell" title="%(name)%">%(name)%</td>
    <td>%(statements)%</td>
    <td>%(missing)%</td>
    <td data-order="%(branches)%">%(branch_cell)%</td>
    <td class="cov-cell" data-order="%(percent)%">
        <span class="cov-bar"><span class="cov-bar__fill cov-bar__fill--%(grade)%" style="width:%(percent)%%"></span></span>
        <span class="cov-bar__value">%(display)%%</span>
    </td>
    <td class="th-left cov-lines">%(lines)%</td>
</tr>
