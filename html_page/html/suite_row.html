<tr>
    <td class="suite-cell jump-cell" data-jump="suite" data-target="%(sindex)%" tabindex="0" role="link"
        title="Open this suite in Test Steps">%(sname)%</td>
    <td class="metric-num metric-pass"><span class="metric-pill">%(spass)%</span></td>
    <td class="metric-num metric-fail"><span class="metric-pill">%(sfail)%</span></td>
    <td class="metric-num metric-skip"><span class="metric-pill">%(sskip)%</span></td>
    <td class="metric-num metric-xpass"><span class="metric-pill">%(sxpass)%</span></td>
    <td class="metric-num metric-xfail"><span class="metric-pill">%(sxfail)%</span></td>
    <td class="metric-num metric-error"><span class="metric-pill">%(serror)%</span></td>
    <td class="metric-num metric-rerun"><span class="metric-pill">%(srerun)%</span></td>
</tr>
