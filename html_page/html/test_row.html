<tr id="%(anchor)%">
    <td class="jump-cell" data-jump="suite" data-target="%(sindex)%" tabindex="0" role="link"
        title="Open this suite in Test Steps"
        style="word-wrap: break-word;max-width: 200px; white-space: normal; text-align:left">%(sname)%</td>
    <td class="jump-cell" data-jump="test" data-target="%(runt)%" tabindex="0" role="link"
        title="Open this test in Test Steps"
        style="word-wrap: break-word;max-width: 200px; white-space: normal; text-align:left">%(name)%</td>
    <td>%(stat)%</td>
    <td>%(dur)%</td>
    <!-- The count opens the trail behind it when there is one, and reads as a
         plain figure when the test ran once - which is nearly every row. One
         element either way, not a button beside a span: the cell's text is
         what the search index and every CSV, Excel and print export take, and
         two spellings of the count would put the number in each of them twice.
         data-attempts is what the two appearances key off, and it is the
         attempt count rather than the rerun count so that an archive written
         before the trail existed - a count with nothing stored behind it -
         stays a plain figure instead of offering an empty panel. -->
    <td class="metric-num metric-rerun rerun-cell" data-attempts="%(attempt_count)%">
        <button type="button" class="metric-pill rerun-btn" onclick="showAttemptsFor('%(runt)%')"
                title="See what happened on every attempt">%(rerun)%</button>
    </td>
    <!-- The last few characters of a cut message fade out instead of ending in
         an ellipsis. The ellipsis is still here, hidden: a CSV and a print-out
         carry the cell's text and cannot carry a gradient, and a message that
         was cut short with nothing to say so is a trap in both. -->
    <td style="word-wrap: break-word;max-width: 200px; white-space: normal; text-align:left">
        %(msg)%<span class="msg-fade">%(msg_tail)%</span><span class="msg-cut">%(msg_cut)%</span>
        %(floating_error_text)%
    </td>
    <td class="log-cell" data-logs="%(log_count)%">
        <button type="button" class="log-btn" onclick="showLogs('%(runt)%')" title="View captured output">
            <i class="fa fa-align-left" aria-hidden="true"></i>%(log_count)%
        </button>
        <span class="log-none">&mdash;</span>
    </td>
    <td class="log-cell" data-logs="%(attach_count)%">
        <button type="button" class="log-btn" onclick="showAttachmentsFor('%(runt)%')" title="View API logs and attachments">
            <i class="fa fa-exchange" aria-hidden="true"></i>%(attach_count)%
        </button>
        <span class="log-none">&mdash;</span>
    </td>
    <td class="log-cell" data-logs="%(step_count)%">
        <button type="button" class="log-btn" onclick="showStepsFor('%(runt)%')" title="View this test step by step">
            <i class="fa fa-list-ol" aria-hidden="true"></i>%(step_count)%
        </button>
        <span class="log-none">&mdash;</span>
    </td>
    <!-- data-order is what the column sorts on: the cell is a strip of
         pictures, and its text - which is what DataTables would otherwise
         compare - is the same empty string on every row. -->
    <td class="log-cell shot-cell" data-logs="%(shot_count)%" data-order="%(shot_count)%">
        <div class="shot-strip">%(shots)%</div>
        <span class="log-none">&mdash;</span>
    </td>
</tr>
