<tr>
    <td style="word-wrap: break-word;max-width: 200px; white-space: normal; text-align:left">%(sname)%</td>
    <td style="word-wrap: break-word;max-width: 200px; white-space: normal; text-align:left">%(name)%</td>
    <td>%(stat)%</td>
    <td>%(dur)%</td>
    <td class="metric-num metric-rerun"><span class="metric-pill">%(rerun)%</span></td>
    <td style="word-wrap: break-word;max-width: 200px; white-space: normal; text-align:left">
        %(msg)%
        %(floating_error_text)%
    </td>
    <td class="log-cell" data-logs="%(log_count)%">
        <button type="button" class="log-btn" onclick="showLogs('%(runt)%')" title="View captured output">
            <i class="fa fa-align-left" aria-hidden="true"></i>%(log_count)%
        </button>
        <span class="log-none">&mdash;</span>
    </td>
    <td class="log-cell" data-logs="%(attach_count)%">
        <button type="button" class="log-btn" onclick="showAttachmentsFor('%(runt)%')" title="View API logs and attachments">
            <i class="fa fa-exchange" aria-hidden="true"></i>%(attach_count)%
        </button>
        <span class="log-none">&mdash;</span>
    </td>
    <td class="log-cell" data-logs="%(step_count)%">
        <button type="button" class="log-btn" onclick="showStepsFor('%(runt)%')" title="View this test step by step">
            <i class="fa fa-list-ol" aria-hidden="true"></i>%(step_count)%
        </button>
        <span class="log-none">&mdash;</span>
    </td>
</tr>
