<button type="button" class="step-test" id="step-test-%(sid)%" data-sid="%(sid)%" data-status="%(stat)%" data-kind="%(kind)%" data-search="%(search)%" onclick="showStep('%(sid)%')">
    <span class="step-test__dot step-test__dot--%(stat)%"></span>
    <span class="step-test__main">
        <span class="step-test__name">%(name)%</span>
        <span class="step-test__note">%(note)%</span>
    </span>
    <span class="step-test__ms">%(dur)%</span>
</button>
