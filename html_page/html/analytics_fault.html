<li class="fault">
    <div class="fault__head">
        <span class="fault__name">%(name)%</span>
        <span class="fault__count">%(count)%</span>
        <span class="fault__share">%(share)%%</span>
        <span class="fault__delta fault__delta--%(tone)%">%(delta)%</span>
    </div>
    <div class="fault__bar"><i style="width: %(share)%%"></i></div>
    <ul class="fault__tests">%(tests)%</ul>
</li>
