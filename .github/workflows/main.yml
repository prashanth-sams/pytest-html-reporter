on:
  pull_request:
    branches: [ master ]
name: CI
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: cclauss/Find-Python-syntax-errors-action@master
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Dependencies
        run: |
          pip3 install -r requirements.txt
          pip3 install -e .
      # `coverage run -m pytest` rather than `pytest --cov`: this package is a
      # pytest11 plugin, so pytest imports all of it before pytest-cov starts
      # tracing and every import-time line is counted as missed. See .coveragerc.
      - name: Run Tests
        run: |
          python3 -m coverage run -m pytest tests/unit/
          python3 -m coverage report -m
          coveralls --service=github
          bash <(curl -s https://codecov.io/bash)