[pytest]
markers =
    slow: mark as slow tests
    fast: mark as fast tests
addopts = -v -rf --capture=tee-sys
environment = staging
build_info =
    branch=main
    team=payments
# What turns @pytest.mark.jira("PAY-412") into a badge that opens the ticket.
# The hosts are made up - nothing is fetched, so a link that goes nowhere still
# renders, which is the point of a url template over an api client.
report_link_pattern =
    jira = https://acme.atlassian.net/browse/{}
    testcase = https://acme.testrail.io/index.php?/cases/view/{}
